<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PEEK-A-SNIP!</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07040f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peek-a-Snip">
<meta name="description" content="Snip away the cover, reveal the funny picture, trap the spider!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#07040f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
body{background:radial-gradient(ellipse at center,#160c2e 0%,#07040f 75%)}
#safe{position:fixed;left:env(safe-area-inset-left,0);right:env(safe-area-inset-right,0);top:env(safe-area-inset-top,0);bottom:env(safe-area-inset-bottom,0);display:flex;align-items:center;justify-content:center}
#wrap{position:relative;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;filter:saturate(1.15) contrast(1.05) brightness(1.05)}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--px,3px)*.5),rgba(0,0,0,.16) calc(var(--px,3px)*.5),rgba(0,0,0,.16) var(--px,3px))}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 65%,rgba(0,0,0,.45) 100%)}
@media (prefers-reduced-motion:reduce){#scan{display:none}}
noscript{color:#fff;font:16px sans-serif;position:fixed;top:40%;width:100%;text-align:center}
</style>
</head>
<body>
<div id="safe"><div id="wrap"><canvas id="c" aria-label="Peek-a-Snip game"></canvas><div id="scan"></div><div id="vig"></div></div></div>
<noscript>Please enable JavaScript to play.</noscript>
<script src="app.js?v=mvgls9yy"></script>
</body>
</html>
